<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>タイムカプセルAR - 未来への思い出記録</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif; }
    body, html {
      margin: 0; padding: 0; width: 100vw; height: 100vh;
      overflow: hidden; background: #000; color: #f7f3ed; touch-action: none;
    }

    /* 1. カメラ映像 */
    #webcam {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      object-fit: cover; z-index: 1; transform-origin: center center;
    }

    /* 2. AR空間描画レイヤー */
    #ar-layer {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 2; pointer-events: none; transform-origin: center center;
    }
    #ar-canvas {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
    }

    /* 上部UIコントロール */
    #top-controls {
      position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 6px; background: rgba(15, 15, 15, 0.75);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      padding: 6px 12px; border-radius: 25px; border: 1px solid rgba(228, 195, 139, 0.4);
      z-index: 10; box-shadow: 0 8px 25px rgba(0,0,0,0.6); align-items: center;
    }
    .control-btn {
      background: transparent; border: 1px solid rgba(228, 195, 139, 0.5);
      color: #f7f3ed; padding: 5px 10px; border-radius: 15px; font-size: 10px;
      letter-spacing: 0.05em; cursor: pointer; transition: all 0.2s; outline: none; white-space: nowrap;
    }
    .control-btn:active { transform: scale(0.95); background: rgba(228, 195, 139, 0.2); }

    #info-overlay {
      position: absolute; top: 65px; left: 50%; transform: translateX(-50%);
      color: rgba(247, 243, 237, 0.85); font-size: 9.5px; letter-spacing: 0.08em;
      z-index: 10; pointer-events: none; text-align: center; text-shadow: 0 2px 4px rgba(0,0,0,0.8); white-space: nowrap;
    }
    #status { font-weight: 500; color: #e4c38b; }

    /* メッセージ＆名前入力バー */
    #post-meta-bar {
      position: absolute; bottom: 110px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 8px; background: rgba(15, 15, 15, 0.85); backdrop-filter: blur(16px);
      padding: 8px 14px; border-radius: 20px; border: 1px solid rgba(228, 195, 139, 0.4);
      z-index: 10; align-items: center; max-width: 92vw;
    }
    #nick-input {
      background: rgba(255,255,255,0.1); border: 1px solid rgba(228, 195, 139, 0.4);
      color: #fff; padding: 6px 10px; border-radius: 12px; font-size: 11px; width: 75px; outline: none;
    }
    #msg-input {
      background: rgba(255,255,255,0.1); border: 1px solid rgba(228, 195, 139, 0.4);
      color: #fff; padding: 6px 12px; border-radius: 12px; font-size: 11px; width: 160px; outline: none;
    }

    /* 下部シャッター＆操作フッター */
    #shutter-container {
      position: absolute; bottom: 25px; left: 0; width: 100%;
      display: flex; justify-content: center; align-items: center; gap: 24px; z-index: 10;
    }
    #shutter-btn {
      width: 76px; height: 76px; border-radius: 50%;
      background: linear-gradient(135deg, #ffffff 0%, #d8c4b6 50%, #b8977e 100%);
      border: 3px solid rgba(228, 195, 139, 0.95); cursor: pointer;
      box-shadow: 0 12px 35px rgba(0,0,0,0.7), inset 0 2px 6px rgba(255,255,255,0.95);
      transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1); outline: none;
    }
    #shutter-btn:active { transform: scale(0.92); }

    .icon-btn {
      width: 46px; height: 46px; border-radius: 50%;
      background: rgba(15, 15, 15, 0.8); border: 1px solid rgba(228, 195, 139, 0.5);
      color: #e4c38b; display: flex; align-items: center; justify-content: center;
      cursor: pointer; backdrop-filter: blur(12px); box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      font-size: 18px; position: relative;
    }
    .icon-btn:active { transform: scale(0.92); }
    #badge {
      position: absolute; top: -4px; right: -4px; background: #e4c38b; color: #000;
      font-size: 10px; font-weight: bold; border-radius: 10px; padding: 2px 6px; display: none;
    }

    /* モーダル構造 */
    .modal {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(8, 8, 12, 0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      z-index: 100; display: none; flex-direction: column;
    }
    .modal-header {
      padding: 16px 20px; display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid rgba(228, 195, 139, 0.2);
    }
    .modal-title { font-size: 14px; font-weight: 600; color: #e4c38b; letter-spacing: 0.08em; }
    .close-btn { background: none; border: none; color: #f7f3ed; font-size: 22px; cursor: pointer; }

    /* アルバム（カプセル一覧） */
    .album-grid {
      flex: 1; overflow-y: auto; padding: 16px;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; align-content: start;
    }
    .album-item {
      position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden;
      border: 1px solid rgba(228, 195, 139, 0.3); background: #111;
    }
    .album-item img { width: 100%; height: 100%; object-fit: cover; }
    .album-item .item-info {
      position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(0,0,0,0.9));
      padding: 6px 8px; font-size: 9.5px; display: flex; flex-direction: column; gap: 2px;
    }
    .album-item .item-user { color: #e4c38b; font-weight: bold; }
    .album-item .item-date { color: #aaa; font-size: 8px; }

    /* QRモーダル */
    .qr-container { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
    #qrcode { background: #fff; padding: 16px; border-radius: 16px; margin-bottom: 20px; }

    /* トースト通知 */
    #toast-notification {
      position: fixed; top: 100px; left: 50%; transform: translateX(-50%) translateY(-20px);
      background: linear-gradient(135deg, #e4c38b, #b8977e); color: #000; font-weight: bold;
      padding: 10px 22px; border-radius: 25px; font-size: 12px; z-index: 200; opacity: 0;
      pointer-events: none; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 10px 25px rgba(228,195,139,0.4);
    }
    #toast-notification.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #flash { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #fff; opacity: 0; pointer-events: none; z-index: 50; transition: opacity 0.15s ease-out; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

  <!-- カメラ ＆ AR描画レイヤー -->
  <video id="webcam" autoplay playsinline muted></video>
  <div id="ar-layer">
    <canvas id="ar-canvas"></canvas>
  </div>

  <!-- 上部UIコントロール -->
  <div id="top-controls">
    <button class="control-btn" onclick="switchCamera()">Cam ⟳</button>
    <button class="control-btn" onclick="resetZoom()">1.0x リセット</button>
    <button class="control-btn" onclick="resetCapsules()">🗑️ 空間クリア</button>
  </div>

  <div id="info-overlay">
    TIME CAPSULE AR | <span id="status">INITIALIZING...</span>
  </div>

  <div id="flash"></div>
  <div id="toast-notification">✨ 空間にタイムカプセルを保存しました！</div>

  <!-- 投稿メッセージ入力 -->
  <div id="post-meta-bar">
    <input type="text" id="nick-input" placeholder="名前" maxlength="10" value="Guest">
    <input type="text" id="msg-input" placeholder="思い出のメッセージ..." maxlength="25">
  </div>

  <!-- 下部操作バー -->
  <div id="shutter-container">
    <button class="icon-btn" onclick="openQRModal()" title="共有用QR">📱</button>
    <button id="shutter-btn" title="Capture"></button>
    <button class="icon-btn" onclick="openAlbumModal()" title="タイムカプセル一覧">
      <span>📦</span><span id="badge">0</span>
    </button>
  </div>

  <!-- アルバムモーダル -->
  <div class="modal" id="album-modal">
    <div class="modal-header">
      <div class="modal-title">タイムカプセル一覧 (空間保存データ)</div>
      <button class="close-btn" onclick="closeModal('album-modal')">✕</button>
    </div>
    <div class="album-grid" id="album-grid"></div>
  </div>

  <!-- QRコードモーダル -->
  <div class="modal" id="qr-modal">
    <div class="modal-header">
      <div class="modal-title">同じ場所でQRを読み込む</div>
      <button class="close-btn" onclick="closeModal('qr-modal')">✕</button>
    </div>
    <div class="qr-container">
      <div id="qrcode"></div>
      <div style="font-size: 12px; color: #ccc; line-height: 1.6; max-width: 280px;">
        後日同じ場所でこのQRコードを開くと、空間上に保存されたタイムカプセルが再出現します。
      </div>
    </div>
  </div>

  <script>
    const webcamEl = document.getElementById('webcam');
    const arLayer = document.getElementById('ar-layer');
    const statusEl = document.getElementById('status');
    const arCanvas = document.getElementById('ar-canvas');
    const ctx = arCanvas.getContext('2d');
    const shutterBtn = document.getElementById('shutter-btn');
    const badgeEl = document.getElementById('badge');
    const flashEl = document.getElementById('flash');
    const toastEl = document.getElementById('toast-notification');

    // 空間保存データ（LocalStorage）
    let capsuleList = JSON.parse(localStorage.getItem('time_capsule_ar_data') || '[]');

    // --- カメラ＆ズーム関連変数 ---
    let useFrontCamera = false;
    let currentStream = null;
    let currentZoom = 1.0;
    const MIN_ZOOM = 1.0;
    const MAX_ZOOM = 5.0;

    // --- タッチパン（ドラッグ移動）＆ピンチズーム変数 ---
    let panX = 0, panY = 0;
    let startX = 0, startY = 0;
    let isDragging = false;
    let initialPinchDistance = null;
    let zoomStartValue = 1.0;

    // --- 1. 高画質カメラ制御 ---
    async function initCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }
      try {
        const constraints = {
          video: {
            facingMode: useFrontCamera ? "user" : { exact: "environment" },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        };
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        webcamEl.srcObject = currentStream;
        webcamEl.onloadedmetadata = () => { updateStatusText(); };
      } catch (err) {
        try {
          currentStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
          webcamEl.srcObject = currentStream;
          webcamEl.onloadedmetadata = () => { updateStatusText(); };
        } catch (e) {
          statusEl.textContent = "CAMERA ERROR";
        }
      }
    }

    function switchCamera() {
      useFrontCamera = !useFrontCamera;
      initCamera();
    }

    function updateStatusText() {
      const mode = useFrontCamera ? "FRONT CAM" : "BACK CAM";
      statusEl.textContent = `${mode} | ズーム: ${currentZoom.toFixed(1)}x | カプセル: ${capsuleList.length}件`;
    }

    // --- 2. タッチ＆スライド／ピンチイン・ピンチアウト操作 ---
    function updateTransform() {
      const transformStr = `translate(${panX}px, ${panY}px) scale(${currentZoom})`;
      webcamEl.style.transform = transformStr;
      arLayer.style.transform = transformStr;
      updateStatusText();
    }

    function resetZoom() {
      currentZoom = 1.0;
      panX = 0;
      panY = 0;
      updateTransform();
    }

    function getDistance(touches) {
      const dx = touches[0].clientX - touches[1].clientX;
      const dy = touches[0].clientY - touches[1].clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }

    window.addEventListener('touchstart', (e) => {
      if (e.target.closest('#top-controls') || e.target.closest('#shutter-container') || e.target.closest('#post-meta-bar') || e.target.closest('.modal')) return;

      if (e.touches.length === 1) {
        isDragging = true;
        startX = e.touches[0].clientX - panX;
        startY = e.touches[0].clientY - panY;
      } else if (e.touches.length === 2) {
        isDragging = false;
        initialPinchDistance = getDistance(e.touches);
        zoomStartValue = currentZoom;
      }
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (e.target.closest('.modal')) return;
      e.preventDefault();

      if (e.touches.length === 1 && isDragging) {
        panX = e.touches[0].clientX - startX;
        panY = e.touches[0].clientY - startY;
        updateTransform();
      } else if (e.touches.length === 2 && initialPinchDistance !== null) {
        const currentDist = getDistance(e.touches);
        if (initialPinchDistance > 0) {
          const ratio = currentDist / initialPinchDistance;
          currentZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, zoomStartValue * ratio));
          updateTransform();
        }
      }
    }, { passive: false });

    window.addEventListener('touchend', (e) => {
      if (e.touches.length === 0) {
        isDragging = false;
        initialPinchDistance = null;
      }
    });

    // --- 3. Canvas解像度設定 ---
    let dpr = Math.min(window.devicePixelRatio || 1, 2);
    function resizeCanvas() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      const width = window.innerWidth;
      const height = window.innerHeight;

      arCanvas.width = width * dpr;
      arCanvas.height = height * dpr;
      arCanvas.style.width = width + 'px';
      arCanvas.style.height = height + 'px';
      ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // --- 4. タイムカプセルARのレンダリングループ（空間浮遊アニメーション） ---
    const imageCache = {};
    let timeCount = 0;

    function renderLoop() {
      timeCount += 0.02;
      const w = window.innerWidth;
      const h = window.innerHeight;
      ctx.clearRect(0, 0, w, h);

      capsuleList.forEach((capsule, index) => {
        if (!imageCache[capsule.id]) {
          const img = new Image();
          img.src = capsule.dataUrl;
          imageCache[capsule.id] = img;
        }

        const cachedImg = imageCache[capsule.id];
        if (!cachedImg || !cachedImg.complete) return;

        // ふわふわと浮かび上がる揺れ計算
        const floatY = Math.sin(timeCount + index) * 10;
        const floatX = Math.cos(timeCount * 0.7 + index) * 6;

        const x = (capsule.x * w) + floatX;
        const y = (capsule.y * h) + floatY;
        const baseSize = Math.min(w, h) * 0.28 * capsule.scale;

        ctx.save();
        ctx.translate(x, y);

        // タイムカプセル風ポラロイド額縁
        const pad = 8;
        const bottomPad = 30;
        ctx.fillStyle = "rgba(255, 255, 255, 0.94)";
        ctx.shadowColor = "rgba(0, 0, 0, 0.6)";
        ctx.shadowBlur = 18;
        ctx.shadowOffsetY = 6;

        ctx.beginPath();
        ctx.roundRect(-baseSize/2 - pad, -baseSize/2 - pad, baseSize + pad*2, baseSize + pad + bottomPad, 10);
        ctx.fill();

        // 写真描画
        ctx.drawImage(cachedImg, -baseSize/2, -baseSize/2, baseSize, baseSize);

        // テキスト（名前・メッセージ・日付）描画
        ctx.fillStyle = "#111";
        ctx.font = "bold 10px sans-serif";
        ctx.textAlign = "left";
        ctx.fillText(`${capsule.user}: ${capsule.msg}`, -baseSize/2, baseSize/2 + 13);

        ctx.fillStyle = "#666";
        ctx.font = "8px sans-serif";
        ctx.fillText(capsule.date, -baseSize/2, baseSize/2 + 23);

        ctx.restore();
      });

      requestAnimationFrame(renderLoop);
    }
    renderLoop();

    // --- 5. 写真撮影 ＆ タイムカプセル空間保存 ---
    shutterBtn.addEventListener('click', () => {
      flashEl.style.opacity = '0.8';
      setTimeout(() => flashEl.style.opacity = '0', 150);

      const saveCanvas = document.createElement('canvas');
      const lw = window.innerWidth;
      const lh = window.innerHeight;
      saveCanvas.width = lw * dpr;
      saveCanvas.height = lh * dpr;
      const sCtx = saveCanvas.getContext('2d');
      sCtx.scale(dpr, dpr);

      // カメラ映像の合成（ズーム倍率＆位置オフセット反映）
      if (webcamEl.readyState === webcamEl.HAVE_ENOUGH_DATA) {
        const vW = webcamEl.videoWidth;
        const vH = webcamEl.videoHeight;
        const vRatio = vW / vH;
        const cRatio = lw / lh;

        let dw = lw, dh = lh, dx = 0, dy = 0;
        if (vRatio > cRatio) { dw = lh * vRatio; dx = (lw - dw) / 2; }
        else { dh = lw / vRatio; dy = (lh - dh) / 2; }

        sCtx.save();
        sCtx.translate(lw / 2 + panX, lh / 2 + panY);
        sCtx.scale(currentZoom, currentZoom);
        sCtx.translate(-lw / 2, -lh / 2);
        sCtx.drawImage(webcamEl, dx, dy, dw, dh);
        sCtx.restore();
      }

      const capturedDataUrl = saveCanvas.toDataURL('image/jpeg', 0.88);
      const user = document.getElementById('nick-input').value.trim() || 'Guest';
      const msg = document.getElementById('msg-input').value.trim() || '思い出のタイムカプセル';
      const dateStr = new Date().toLocaleDateString('ja-JP', { year: 'numeric', month: 'short', day: 'numeric' });

      // 新規タイムカプセル（画面中央付近にランダム配置）
      const newCapsule = {
        id: Date.now(),
        dataUrl: capturedDataUrl,
        user: user,
        msg: msg,
        date: dateStr,
        x: 0.35 + Math.random() * 0.3,
        y: 0.35 + Math.random() * 0.3,
        scale: 1.0
      };

      capsuleList.unshift(newCapsule);
      if (capsuleList.length > 30) capsuleList.pop();

      try {
        localStorage.setItem('time_capsule_ar_data', JSON.stringify(capsuleList));
      } catch(e){}

      updateAlbumView();
      updateStatusText();
      showToastNotification("✨ 空間にタイムカプセルを保存しました！");
      document.getElementById('msg-input').value = '';
    });

    // --- 6. モーダル ＆ 補助UI ---
    function updateAlbumView() {
      const grid = document.getElementById('album-grid');
      if (capsuleList.length === 0) {
        grid.innerHTML = '<div style="grid-column: 1/-1; text-align:center; color:#777; font-size:12px; margin-top:50px;">タイムカプセルがありません</div>';
        badgeEl.style.display = 'none';
        return;
      }
      badgeEl.textContent = capsuleList.length;
      badgeEl.style.display = 'block';

      grid.innerHTML = capsuleList.map(p => `
        <div class="album-item">
          <img src="${p.dataUrl}" alt="Memory">
          <div class="item-info">
            <span class="item-user">${p.user}</span>
            <span style="color:#fff; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${p.msg}</span>
            <span class="item-date">${p.date}</span>
          </div>
        </div>
      `).join('');
    }

    function resetCapsules() {
      if (confirm("この空間のタイムカプセルをすべてクリアしますか？")) {
        capsuleList = [];
        localStorage.removeItem('time_capsule_ar_data');
        updateAlbumView();
        updateStatusText();
        showToastNotification("空間を初期化しました");
      }
    }

    function openAlbumModal() {
      updateAlbumView();
      document.getElementById('album-modal').style.display = 'flex';
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
    }

    let qrGenerated = false;
    function openQRModal() {
      document.getElementById('qr-modal').style.display = 'flex';
      if (!qrGenerated) {
        new QRCode(document.getElementById('qrcode'), { text: window.location.href, width: 170, height: 170 });
        qrGenerated = true;
      }
    }

    function showToastNotification(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      setTimeout(() => toastEl.classList.remove('show'), 3000);
    }

    // 初期化実行
    initCamera();
    updateAlbumView();
  </script>
</body>
</html>
